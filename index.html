<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bienvenue Chez Le R!</title> <!-- Titre dans l'onglet -->

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"> <!-- Remplace favicon.png par ton image -->

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #7f00ff, #e100ff);
            color: white;
        }

        /* En-tête centré avec image et titre */
        header {
            display: flex;
            flex-direction: column; /* empile image et titre */
            align-items: center;    /* centre horizontalement */
            justify-content: center;
            padding: 50px 20px;
            background-color: rgba(0,0,0,0.3);
        }

        header img {
            max-width: 150px;      /* taille de l'image/logo */
            margin-bottom: 20px;   /* espace entre l'image et le titre */
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        main {
            text-align: center;
            padding: 50px 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #ff69b4;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #ff1493;
        }
    </style>
</head>
<body>

    <!-- En-tête -->
    <header>
        <img src="images.jfif" alt="Logo du site"> <!-- Remplace ton-image.png par ton logo -->
        <h1>Bienvenue sur mon site</h1>
    </header>

    <!-- Contenu principal -->
    <main>
        <button onclick="direBonjour()">Clique ici</button>
    </main>

    <script>
        function direBonjour() {
            alert("Bienvenue Chez Le R!");
        }
    </script>

</body>
</html>
