<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #7f00ff;
            text-align: center; /* centre le texte et les éléments */
            color: white; /* pour que le texte ressorte sur violet */
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        img {
            max-width: 300px; /* ajuste la taille de ton image */
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Bienvenue sur mon site</h1>

    <!-- Bouton -->
    <button onclick="direBonjour()">Clique ici</button>

    <!-- Image -->
    <div>
        <img src="ton-image.jpg" alt="Photo de mon site">
    </div>

    <script>
        function direBonjour() {
            alert("Bienvenue Chez Le R!");
        }
    </script>

</body>
</html>
