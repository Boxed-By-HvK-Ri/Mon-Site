<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bienvenue Chez Le R!</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #7f00ff;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            padding: 20px;
            background-color: #5c08bd;
        } 

        header img {
            width: 100px;
            height: auto;
            display: block;
            margin: 0 auto 10px auto;
        }

        h1 {
            margin: 0;
            font-size: 36px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Logo du site">
        <h1>Bienvenue Chez Le R!</h1>
    </header>

    <main>
        <p>Profitez de votre visite sur notre site !</p>
        <button onclick="direBonjour()">Clique ici</button>
    </main>

    <script>
        function direBonjour() {
            alert("Bienvenue Chez Le R!");
        }
    </script>

</body>
</html>
