<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #7f00ff, #e100ff);
            color: white;
        }

        /* En-tête du site */
        header {
            display: flex;
            align-items: center;      /* Aligne le titre et l'image verticalement */
            gap: 15px;                /* Espace entre l'image et le titre */
            padding: 20px 40px;
            background-color: rgba(0,0,0,0.3); /* léger fond pour que ce soit visible */
        }

        header img {
            max-height: 60px;         /* taille du logo */
            border-radius: 10px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        main {
            text-align: center;
            padding: 50px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #ff69b4;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #ff1493;
        }
    </style>
</head>
<body>

    <!-- En-tête -->
    <header>
        <img src="ton-image.jpg" alt="Logo du site">
        <h1>Bienvenue sur mon site</h1>
    </header>

    <!-- Contenu principal -->
    <main>
        <button onclick="direBonjour()">Clique ici</button>
    </main>

    <script>
        function direBonjour() {
            alert("Bienvenue Chez Le R!");
        }
    </script>

</body>
</html>
