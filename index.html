<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #7f00ff, #e100ff); /* joli dégradé violet */
            text-align: center;
            color: white;
            padding: 50px;
        }

        h1 {
            margin-bottom: 40px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #ff69b4;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #ff1493;
        }

        img {
            max-width: 400px;
            margin-top: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <h1>Bienvenue sur mon site</h1>

    <!-- Bouton -->
    <button onclick="direBonjour()">Clique ici</button>

    <!-- Image -->
    <div>
        <img src="����" alt="Photo de mon site">
    </div>

    <script>
        function direBonjour() {
            alert("Bienvenue Chez Le R!");
        }
    </script>

</body>
</html>
