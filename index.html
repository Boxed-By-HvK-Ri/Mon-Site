<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bienvenue Chez Le R!</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #7f00ff;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            padding: 20px;
            background-color: #5c08bd;
        } 

        h1 {
            margin: 0;
            font-size: 36px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
        }

        /* Pour un logo temporaire */
        .logo-placeholder {
            width: 100px;
            height: 100px;
            background-color: white;
            border-radius: 50%;
            margin: 0 auto 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7f00ff;
            font-weight: bold;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <header>
        <!-- Logo temporaire -->
        <div class="logo-placeholder">R</div>
        <h1>Bienvenue Chez Le R!</h1>
    </header>

    <main>
        <p>Profitez de votre visite sur notre site !</p>
        <button onclick="direBonjour()">Clique ici</button>
    </main>

    <script>
        function direBonjour() {
            alert("Bienvenue Chez Le R!");
        }
    </script>

</body>
</html>
